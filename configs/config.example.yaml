# 配置示例（仅供参考，应用不解析本文件）。
#
# 配置加载器（internal/infrastructure/config）完全基于环境变量，
# 不依赖任何外部配置库。可通过 .env / 部署平台的 secret 注入下列变量。
# 格式：ENV_VAR=默认值

# HTTP 服务监听地址
HTTP_ADDR=:8080

# 主数据库 DSN（PostgreSQL）
DATABASE_DSN=

# OpenAI 兼容接入
OPENAI_API_KEY=
OPENAI_BASE_URL=https://api.openai.com/v1

# Anthropic 接入
ANTHROPIC_API_KEY=
ANTHROPIC_BASE_URL=https://api.anthropic.com

# 向量化配置
EMBEDDING_MODEL=
EMBEDDING_DIMENSION=1536
VECTOR_DIMENSION=1536

# 内置工具：网络搜索
WEB_SEARCH_ENDPOINT=
WEB_SEARCH_API_KEY=

# 内置工具：只读 SQL（为空则禁用 sql_query 工具）
SQL_DSN=

# 默认模型与供应商
DEFAULT_MODEL=
DEFAULT_PROVIDER=openai

# 分析任务并发 worker 数
ANALYSIS_WORKERS=2

# 启动时自动迁移数据库
AUTO_MIGRATE=true
