name: ledger

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      TZ: ${TZ:-Asia/Shanghai}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 仅绑定本机，便于本地连库调试；生产环境可删除。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: ledger-api:latest
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_DSN: postgres://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger}@db:5432/${POSTGRES_DB:-ledger}?sslmode=disable
      UPLOAD_DIR: /data/uploads
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-2}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1536}

      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
      DEFAULT_KB_ID: ${DEFAULT_KB_ID:-}

      WEB_SEARCH_ENDPOINT: ${WEB_SEARCH_ENDPOINT:-}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      SQL_DSN: ${SQL_DSN:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    image: ledger-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  uploads:
